name: publish

# Only runs when a v* tag is pushed (for example v1.0.0).
# Pull requests and regular commits never trigger a release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # Required to generate npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        # Prevent tagging v1.0.1 on top of 1.0.0 code.
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "Tag $TAG does not match the package.json version $PKG" >&2
            exit 1
          fi

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js

      - name: Publish to npm
        # Log in to npm with the NPM_TOKEN repository secret and publish.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
